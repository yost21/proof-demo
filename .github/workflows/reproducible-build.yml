# Rebuilds the service_proof canister on a clean Linux machine and checks that the
# wasm's sha256 equals the module hash deployed on the Internet Computer.
# If this job is green, the code running on chain is exactly the code in this repo.
name: reproducible-build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      EXPECTED_SHA256: fe389a3e5ea837250c5187b4c70bfed17c09ca7a9958cc8d8b0f14b01e97765f
      DFX_MOC_PATH: moc-wrapper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install mops 1.12.0
        run: npm install -g ic-mops@1.12.0

      - name: Install ic-wasm 0.9.10
        run: |
          curl -fsSL -o ic-wasm.tar.xz \
            https://github.com/dfinity/ic-wasm/releases/download/0.9.10/ic-wasm-x86_64-unknown-linux-gnu.tar.xz
          tar -xJf ic-wasm.tar.xz
          sudo install "$(find . -name ic-wasm -type f -perm -u+x | head -1)" /usr/local/bin/ic-wasm
          ic-wasm --version

      - name: Build (pinned moc 2.0.0, locked dependencies)
        run: ./scripts/build-wasm.sh | tee build.log

      - name: Compare with the deployed module hash
        run: |
          GOT=$(sha256sum build/service_proof.wasm | cut -d' ' -f1)
          echo "expected: $EXPECTED_SHA256"
          echo "got:      $GOT"
          {
            echo "### service_proof reproducible build"
            echo ""
            echo "| | sha256 |"
            echo "|---|---|"
            echo "| expected (on chain) | \`$EXPECTED_SHA256\` |"
            echo "| this Linux build | \`$GOT\` |"
          } >> "$GITHUB_STEP_SUMMARY"
          test "$GOT" = "$EXPECTED_SHA256"
